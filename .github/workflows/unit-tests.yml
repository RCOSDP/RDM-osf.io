name: Unit Tests

on:
  push:
    branches-ignore:
      - '[0-9]*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push base image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rdm-osf.io:${{ github.sha }}

      - name: Export image reference
        id: meta
        run: echo "image=ghcr.io/${{ github.repository_owner }}/rdm-osf.io:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test_build: [addons, website, api1_and_js, api2, api3_and_osf]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run matrix job
        env:
          TEST_BUILD: ${{ matrix.test_build }}
          OSF_TEST_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          bash .github/scripts/ci/run-tests.sh "$TEST_BUILD"
