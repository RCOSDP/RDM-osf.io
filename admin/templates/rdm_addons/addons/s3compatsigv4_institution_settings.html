{% load i18n %}
<!-- Authorization -->
<div class="addon-settings addon-generic scripted"

     data-addon-name="{{ addon.addon_full_name }}"

      <img class="addon-icon" src="{{ addon.addon_icon_url }}">
      <span>{{ addon.addon_full_name }}</span>
    </h4>
</div>
